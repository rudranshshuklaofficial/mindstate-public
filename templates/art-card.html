<article class="library-card library-art-card"><a class="library-card-image" href="{{ story.link_url }}"><img src="{{ story.image_url }}" alt="{{ story.title }}" loading="lazy"></a><div class="library-card-tags">{% for tag in story.tag_list %}<span>{{ tag }}</span>{% endfor %}</div><h3><a href="{{ story.link_url }}">{{ story.title }}</a></h3><div class="library-card-meta"><time datetime="{{ story.published_at|date:'Y-m-d' }}">{{ story.published_at|date:'d M Y' }}</time>{% if story.author %}<span>· By {{ story.author }}</span>{% else %}<span>· MindState art collection</span>{% endif %}</div></article>
