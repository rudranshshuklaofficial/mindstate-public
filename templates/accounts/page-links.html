{% if page.has_other_pages %}<nav class="pagination" aria-label="Pages">{% if page.has_previous %}<a class="app-button app-outline" href="?q={{ request.GET.q|urlencode }}&section={{ request.GET.section|urlencode }}&status={{ request.GET.status|urlencode }}&page={{ page.previous_page_number }}">Previous</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="app-button app-outline" href="?q={{ request.GET.q|urlencode }}&section={{ request.GET.section|urlencode }}&status={{ request.GET.status|urlencode }}&page={{ page.next_page_number }}">Next</a>{% endif %}</nav>{% endif %}
