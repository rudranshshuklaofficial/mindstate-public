{% extends 'app/base.html' %}{% block title %}Account deletion{% endblock %}{% block content %}<section class="workspace-panel"><h1>Your account is hidden.</h1><p>Deletion is scheduled for {{ deletion.purge_at }}. Cancel before that time to restore eligible content.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="app-form">{% csrf_token %}<label for="cancel-password">Current password</label><input id="cancel-password" name="password" type="password" autocomplete="current-password" required><button class="app-button">Verify and cancel deletion</button></form></section>{% endblock %}
