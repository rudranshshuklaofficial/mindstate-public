{% if form.errors %}<div class="app-error" role="alert">{{ form.non_field_errors }}{% for field in form %}{{ field.errors }}{% endfor %}</div>{% endif %}
<fieldset class="review-choice"><legend>Your decision</legend>{% for value,label in form.fields.decision.choices %}<label><input type="radio" name="decision" value="{{ value }}" required{% if form.decision.value == value %} checked{% endif %}><span><strong>{{ label }}</strong>{% if value == 'approve' %}<small>{% if application %}Unlock the account after guardian permission is recorded.{% else %}Make this approved version available.{% endif %}</small>{% else %}<small>Send a clear note about what needs attention.</small>{% endif %}</span></label>{% endfor %}</fieldset>
<div class="composer-field"><label for="{{ form.note.id_for_label }}">Note to the member</label>{{ form.note }}<small>Your note appears in their tracker.</small></div><button type="submit" class="app-button review-submit">Save decision <span class="ms-icon" aria-hidden="true">arrow_forward</span></button>
