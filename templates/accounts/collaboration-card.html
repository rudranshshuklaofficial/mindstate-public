<article class="collab-request"><div class="collab-card-top"><span class="app-pill">{{ card.need }}</span><span>{{ card.language }}{% if card.demo %} · Demo{% endif %}</span></div><h3><a href="{% url 'collaboration-detail' card.pk %}">{{ card.title }}</a></h3><p>{{ card.brief|truncatechars:170 }}</p><div class="collab-card-bottom"><span>{{ card.credits|join:' + ' }}</span><span>{{ card.status }}</span></div><div class="collaboration-card-actions"><a class="collab-open-link" href="{% url 'collaboration-detail' card.pk %}">Open collaboration <span class="ms-icon" aria-hidden="true">arrow_forward</span></a><a class="app-button app-outline" href="{% url 'collaboration-preview' card.pk %}" data-collab-preview>Preview essay/art</a></div></article>
