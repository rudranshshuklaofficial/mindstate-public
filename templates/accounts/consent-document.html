{% load static %}<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private guardian document preview</title><link rel="stylesheet" href="{% static 'site-fonts.css' %}"><style>body{margin:0;background:#fff8eb;color:#292021;font-family:'Google Sans Flex',sans-serif}figure{margin:20px 12px}img{display:block;width:100%;height:auto}figcaption{padding:8px 0}p{padding:20px}</style></head><body>{% if preview_error %}<p role="alert">This document could not be previewed. Reload to retry, or request a replacement upload.</p>{% else %}{% for page in pages %}<figure><img src="{{ page }}" alt="Signed guardian permission, page {{ forloop.counter }}" loading="lazy"><figcaption>Page {{ forloop.counter }} · Private consent evidence</figcaption></figure>{% endfor %}{% endif %}</body></html>
